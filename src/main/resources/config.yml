# src/main/resources/config.yml
# How often (in seconds) we poll ChatGPT for new challenge completions
poll-interval: 60

# How many of the most recent chat messages to send
window-size: 100

# Your OpenAI API key
openai-api-key: “your-secret-key-here”

# Define each challenge:
#  id: unique string
#  prompt: the check you want ChatGPT to run on the chat window
#  commands: list of Bukkit commands to run; use %player% to insert the winner’s name
challenges:
  greet:
    prompt: "detect when a player says 'hello' or 'hi' to another player"
    commands:
      - "give %player% diamond 1"
  thanks:
    prompt: "detect 'thanks', 'thanks <player>' or 'thank you <player>' in global chat"
    commands:
      - "eco give %player% 50"
  warpinvite:
    prompt: "detect when a player invites others to warp to their island"
    commands:
      - "msg %player% Congrats on inviting others to your island!"
  helpful:
    prompt: "detect when a player says 'gg' or 'congrats'"
    commands:
      - "give %player% emerald 1"
  question:
    prompt: "detect that a player has asked a question to get help from the community"
    commands:
      - "msg %player% Good job asking the community. If you get an answer, don't forget to say thanks!"
# …add as many as you like
